<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{ subject }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f6f9;
      font-family: Arial, Helvetica, sans-serif;
    }
    .wrapper {
      width: 100%;
      background-color: #f4f6f9;
      padding: 40px 0;
    }
    .container {
      max-width: 600px;
      background-color: #ffffff;
      margin: 0 auto;
      border-radius: 10px;
      padding: 40px;
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo img {
      max-height: 50px;
    }
    h1 {
      font-size: 22px;
      color: #111827;
      margin-bottom: 20px;
    }
    p {
      font-size: 14px;
      color: #374151;
      line-height: 1.6;
    }
    .button {
      display: inline-block;
      padding: 12px 20px;
      background-color: #4f46e5;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
      margin-top: 20px;
    }
    .code-box {
      font-size: 26px;
      letter-spacing: 4px;
      font-weight: bold;
      margin: 20px 0;
      text-align: center;
      color: #111827;
    }
    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="container">

      <div class="logo">
        {% if logo_url %}
        <img src="{{ logo_url }}" alt="{{ app_name }}">
        {% else %}
        <h2>{{ app_name }}</h2>
        {% endif %}
      </div>

      {% block content %}{% endblock %}

      <div class="footer">
        This email was sent by {{ app_name }}.<br/>
        If you didn’t request this, you can safely ignore it.<br/>
        Support: {{ support_email }}
      </div>

    </div>
  </div>
</body>
</html>
